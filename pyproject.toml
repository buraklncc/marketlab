[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlab"
version = "0.1.0"
description = "Offline strategy replay, paper execution and risk primitives"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Burak Kılınç"}]
dependencies = ["numpy>=1.24,<3","pandas>=2,<4","statsmodels>=0.14,<1","scikit-learn>=1.3,<2","joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
marketlab = "marketlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

